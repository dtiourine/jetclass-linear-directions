[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jetdirections"
version = "0.1.0"
description = "Interpretable linear directions in a JetClass jet-tagging transformer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "awkward>=2.0",
    "uproot>=5.0",
    "einops>=0.7",
    "tqdm>=4.65",
    "tensorboard>=2.13",
    "nnsight>=0.7.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.10.9",
    "jupyterlab>=4.6.1",
]

[project.scripts]
jetdirections-train = "jetdirections.training.train:main"
jetdirections-eval = "jetdirections.training.evaluate:cli"
jetdirections-plot = "jetdirections.training.plot:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jetdirections"]

[tool.pytest.ini_options]
testpaths = ["tests"]
